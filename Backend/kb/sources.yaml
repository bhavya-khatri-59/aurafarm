# Public extension-service guides that make up the remedy knowledge base.
#
# `crop` and `disease` must use the slugs in app/services/labels.py. Use `general` for material
# that covers several diseases of a crop (disease: general) or several crops (crop: general).
# Documents are fetched by scripts/fetch_kb.py into kb/docs/ (not committed: the text belongs to
# the publishers) and embedded by scripts/ingest_kb.py.

